name: HPKey
# HP Key: Vikey (github.com/tonyminibot/Vikey, commit 03c4939, GPL-3.0) rebranded, without the
# Sparkle updater or crash-report upload. Signed with the owner's local Apple Development identity.
options:
  bundleIdPrefix: com.henryparker
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: RN284D4C8Y
    SWIFT_VERSION: "5.10"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "100"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  HPKey:
    type: application
    platform: macOS
    dependencies:
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
    sources:
      - path: App
      - path: Engine
        excludes:
          - "platforms/win32.h"
          - "platforms/linux.h"
    settings:
      base:
        PRODUCT_NAME: HP Key
        PRODUCT_BUNDLE_IDENTIFIER: com.henryparker.hpkey
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Vikey.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Core/Vikey-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Engine", "$(SRCROOT)/Engine/platforms"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
